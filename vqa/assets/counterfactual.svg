ont-size="18" font-weight="700" fill="#4FE0B0">“red”</text></g><rect x="820" y="382" width="300" height="44" rx="11" fill="#1E2540" stroke="#4FE0B0" stroke-opacity=".5" stroke-width="1.5"/><g style="animation:r2b 9s ease-out infinite"><rect x="933.5" y="397" width="14" height="14" rx="3.5" fill="#3E8BFF" stroke="#8F98B8" stroke-opacity=".5"/><text class="s" x="956.5" y="410.5" font-size="18" font-weight="700" fill="#4FE0B0">“blue”</text></g><g class="fb" style="animation:eq 9s ease-out infinite"><circle cx="760" cy="334" r="18" fill="#13182B" stroke="#8E9BFF" stroke-width="2"/><path d="M753 330.5h14M753 337.5h14" stroke="#8E9BFF" stroke-width="2.4" stroke-linecap="round"/></g><g class="fb" style="animation:ne 9s ease-out infinite"><circle cx="760" cy="404" r="18" fill="#13182B" stroke="#4FE0B0" stroke-width="2"/><path d="M753 400.5h14M753 407.5h14M764 395l-8 18" stroke="#4FE0B0" stroke-width="2.4" stroke-linecap="round"/></g><path d="M706 334H736M784 334H814M706 404H736M784 404H814" stroke="#2E3760" stroke-width="1.5" stroke-dasharray="3 4"/><text class="s" x="600" y="460" font-size="13" text-anchor="middle" fill="#8F98B8">The baseline’s answer cannot change because its input is identical. The test checks whether the multimodal answer does.</text></g></svg>