eX(320px);opacity:0}100.00%{transform:translateX(320px);opacity:0}}@keyframes r1{0.00%{opacity:0;transform:translateY(6px)}32.22%{opacity:0;transform:translateY(6px)}36.11%{opacity:1;transform:translateY(0px)}92.22%{opacity:1;transform:translateY(0px)}96.67%{opacity:0;transform:translateY(0px)}100.00%{opacity:0;transform:translateY(6px)}}@keyframes eq{0.00%{opacity:0;transform:scale(.3)}37.22%{opacity:0;transform:scale(.3)}40.00%{opacity:1;transform:scale(1.15)}41.67%{opacity:1;transform:scale(1)}92.22%{opacity:1;transform:scale(1)}96.67%{opacity:0;transform:scale(1)}100.00%{opacity:0;transform:scale(.3)}}@keyframes r2a{0.00%{opacity:0;transform:translateY(6px)}43.33%{opacity:0;transform:translateY(6px)}47.22%{opacity:1;transform:translateY(0px)}92.22%{opacity:1;transform:translateY(0px)}96.67%{opacity:0;transform:translateY(0px)}100.00%{opacity:0;transform:translateY(6px)}}@keyframes r2b{0.00%{opacity:0;transform:translateY(6px)}48.89%{opacity:0;transform:translateY(6px)}52.78%{opacity:1;transform:translateY(0px)}92.22%{opacity:1;transform:translateY(0px)}96.67%{opacity:0;transform:translateY(0px)}100.00%{opacity:0;transform:translateY(6px)}}@keyframes ne{0.00%{opacity:0;transform:scale(.3)}54.44%{opacity:0;transform:scale(.3)}57.22%{opacity:1;transform:scale(1.15)}58.89%{opacity:1;transform:scale(1)}92.22%{opacity:1;transform:scale(1)}96.67%{opacity:0;transform:scale(1)}100.00%{opacity:0;transform:scale(.3)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><symbol id="car" viewBox="0 0 164 60" overflow="visible"><path d="M6 42V33Q7 25 19 23.5L44 21 61 7.5Q66 4 73 4H111Q119 4 125 9.5L139 22 150 24Q158 26 158 35V42Q158 47 153 47H11Q6 47 6 42Z" fill="currentColor"/><path d="M51 21.5 64 10.5Q67 8 71 8H89V21.5Z" fill="#D6E6FF" opacity=".88"/><path d="M95 8H110Q115 8 119 11.5L130 21.5H95Z" fill="#D6E6FF" opacity=".88"/><path d="M14 30Q40 27 80 27T150 30" stroke="#fff" stroke-opacity=".25" stroke-width="2" fill="none"/><rect x="151" y="29" width="6" height="5" rx="1.5" fill="#FFE8A8"/><rect x="6.5" y="29" width="5" height="5" rx="1.5" fill="#FFC2C2"/><circle cx="38" cy="47" r="11" fill="#0E1120"/><circle cx="38" cy="47" r="4.5" fill="#9AA3C2"/><circle cx="126" cy="47" r="11" fill="#0E1120"/><circle cx="126" cy="47" r="4.5" fill="#9AA3C2"/></symbol><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A3768"/><stop offset="1" stop-color="#4C5F99"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#5A6596"/></marker><clipPath id="frame"><rect width="1200" height="480" rx="24"/></clipPath><clipPath id="qclip"><rect x="591" y="93" width="338" height="38" rx="11"/></clipPath><linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#F2B84B" stop-opacity="0"/><stop offset=".5" stop-color="#F2B84B" stop-opacity=".45"/><stop offset="1" stop-color="#F2B84B" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#frame)"><rect width="1200" height="480" fill="#13182B"/><text class="s" x="40" y="48" font-size="22" font-weight="700" fill="#EDEFF7">Same question, two images</text><text class="s" x="40" y="72" font-size="14" fill="#8F98B8">A planned qualitative test: does the prediction change when only the image changes?</text><rect x="938" y="30" width="222" height="28" rx="14" fill="#F2B84B" fill-opacity=".08" stroke="#F2B84B" stroke-opacity=".7"/><text class="s" x="1049" y="49" font-size="13" text-anchor="middle" fill="#F2B84B">Expected behavior, not results</text><rect x="590" y="92" width="340" height="40" rx="12" fill="#1E2540" stroke="#2E3760" stroke-width="1.5"/><circle cx="612" cy="112" r="11" fill="#8E9BFF" fill-opacity=".18" stroke="#8E9BFF"/><text class="s" x="612" y="116.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#8E9BFF">Q</text><text class="m" x="634" y="118" font-size="16" fill="#EDEFF7">What color is the car?</text><