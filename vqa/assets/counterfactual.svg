idth="164.0" height="60.0" color="#E5484D" style="color:#E5484D"/></g><g clip-path="url(#ia)"><rect x="400" y="156" width="80" height="140" fill="url(#beam)" style="animation:sweep 9s ease-in-out infinite;opacity:0"/></g><rect x="400" y="156" width="300" height="140" rx="12" fill="none" stroke="#2E3760" stroke-width="1.5"/><rect x="412" y="168" width="66" height="22" rx="11" fill="#13182B" fill-opacity=".78"/><text class="s" x="445" y="183" font-size="12" text-anchor="middle" fill="#EDEFF7">Image A</text><clipPath id="ib"><rect x="820" y="156" width="300" height="140" rx="12"/></clipPath><g clip-path="url(#ib)"><rect x="820" y="156" width="300" height="140" fill="url(#sky)"/><circle cx="1078" cy="190" r="13" fill="#F2B84B" opacity=".85"/><path d="M820 234 Q874.0 212.0 931.0 226.0 T1042.0 220.4 T1120 228.8 V296 H820Z" fill="#222C55"/><rect x="820" y="240" width="300" height="56" fill="#262B42"/><rect x="830.0" y="274.7" width="18" height="3" rx="1.5" fill="#6D7596" opacity=".7"/><rect x="864.0" y="274.7" width="18" height="3" rx="1.5" fill="#6D7596" opacity=".7"/><rect x="898.0" y="274.7" width="18" height="3" rx="1.5" fill="#6D7596" opacity=".7"/><rect x="932.0" y="274.7" width="18" height="3" rx="1.5" fill="#6D7596" opacity=".7"/><rect x="966.0" y="274.7" width="18" height="3" rx="1.5" fill="#6D7596" opacity=".7"/><rect x="1000.0" y="274.7" width="18" height="3" rx="1.5" fill="#6D7596" opacity=".7"/><rect x="1034.0" y="274.7" width="18" height="3" rx="1.5" fill="#6D7596" opacity=".7"/><rect x="1068.0" y="274.7" width="18" height="3" rx="1.5" fill="#6D7596" opacity=".7"/><rect x="1102.0" y="274.7" width="18" height="3" rx="1.5" fill="#6D7596" opacity=".7"/><ellipse cx="970.0" cy="264.0" rx="72.0" ry="5.0" fill="#000" opacity=".35"/><use href="#car" xlink:href="#car" x="888.0" y="206" width="164.0" height="60.0" color="#3E8BFF" style="color:#3E8BFF"/></g><g clip-path="url(#ib)"><rect x="820" y="156" width="80" height="140" fill="url(#beam)" style="animation:sweep 9s 